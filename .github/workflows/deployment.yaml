name: Conduit-Container CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/c-container # only for test

env:
  REGISTRY: ghcr.io

jobs:

  # --- BUILD Backend---
  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Check the repository and its submodules
      - name: Check Repository (inc. Submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
        
        # This action is necessary for caching to work. 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND BUILD ---
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/conduit-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/conduit-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # --- BUILD FRONTEND ---
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Repository (inc. Submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # This action is necessary for caching to work. 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Frontend BUILD ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/conduit-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/conduit-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-to-server:
    runs-on: ubuntu-latest
    # This job depends on the successful completion of the build-backend and build-frontend jobs
    needs: [build-backend, build-frontend]

    steps:  
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # 1. Create a folder
      - name: Copy docker-compose, any files and configurations via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }} # Falls dein Key verschlüsselt ist
          source: "docker-compose.yml,.gitmodules,example.env,.dockerignore,.gitignore"
          target: "~/Conduit-Container/"

      - name: Log Success Message
        run: echo "The folder was successfully created, and the .env file was successfully added"

      # 2. SSH Connection to the server and execute commands
      - name: Update and restart Docker containers via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          envs: ENV_CONTENT # Enables the variable for this script
          script: |
            # 1. Create and go to the project directory
            mkdir -p ~/Conduit-Container
            cd ~/Conduit-Container || exit 1

            # 2. Write to the .env file securely with its contents
            echo "$ENV_CONTENT" > .env || exit 1

            # 3. Log in to GitHub Container Registry
            echo "${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || exit 1

            # 4. Update and Start the Container
            docker compose pull
            docker compose up -d --remove-orphans

            # 5. Free up storage space
            docker image prune -f
        env:
          ENV_CONTENT: ${{ secrets.DOT_ENV_FILE }}